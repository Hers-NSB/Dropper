name: Ejecutable Windows
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/independent-publisher-recorder, fix/session-ui-autosave, fix/telegram-feed-verification]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recorder-exe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  encoder:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      FFMPEG_REV: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
      X264_REV: 31e19f92f00c7003fa115047ce50978bc98c3a0d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: encoder-cache
        with:
          path: vendor/encoder
          key: encoder-win64-${{ env.FFMPEG_REV }}-${{ env.X264_REV }}-${{ hashFiles('scripts/build_minimal_ffmpeg.sh') }}
      - name: Reuse identical compiled encoder
        id: encoder-reuse
        if: steps.encoder-cache.outputs.cache-hit != 'true' && env.FFMPEG_REV == '946fcce07b6dcd0331c8cc609192aeff5e1924f8' && env.X264_REV == '31e19f92f00c7003fa115047ce50978bc98c3a0d' && hashFiles('scripts/build_minimal_ffmpeg.sh') == '5cb18a355c3d9a66ad091a0df8dc743e9a708659e59ff302685c93b72f6295af'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: minimal-windows-encoder
          run-id: 42714984226
          github-token: ${{ github.token }}
          path: vendor/encoder
      - uses: actions/checkout@v4
        if: steps.encoder-cache.outputs.cache-hit != 'true' && steps.encoder-reuse.outcome != 'success'
        with:
          repository: FFmpeg/FFmpeg
          ref: ${{ env.FFMPEG_REV }}
          path: third_party/ffmpeg
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.encoder-cache.outputs.cache-hit != 'true' && steps.encoder-reuse.outcome != 'success'
        with:
          repository: mirror/x264
          ref: ${{ env.X264_REV }}
          path: third_party/x264
          persist-credentials: false
      - name: Install cross compiler
        if: steps.encoder-cache.outputs.cache-hit != 'true' && steps.encoder-reuse.outcome != 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix nasm make pkg-config
      - run: bash scripts/build_minimal_ffmpeg.sh
        if: steps.encoder-cache.outputs.cache-hit != 'true' && steps.encoder-reuse.outcome != 'success'
      - name: Include exact encoder sources
        if: steps.encoder-cache.outputs.cache-hit != 'true' && steps.encoder-reuse.outcome != 'success'
        run: |
          mkdir encoder-sources
          git -C third_party/ffmpeg archive HEAD > encoder-sources/ffmpeg.tar
          git -C third_party/x264 archive HEAD > encoder-sources/x264.tar
          cp scripts/build_minimal_ffmpeg.sh encoder-sources/
          cp vendor/encoder/*LICENSE.txt encoder-sources/
          tar -czf vendor/encoder/encoder-sources.tar.gz encoder-sources
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-windows-encoder
          path: vendor/encoder/
          retention-days: 30
          if-no-files-found: error
  build:
    needs: encoder
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: minimal-windows-encoder
          path: vendor/encoder
      - run: python recorder.py check-chrome
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix cloudflare
      - run: node --test cloudflare/worker.test.mjs cloudflare/recording-session.test.mjs
      - run: node --test cloudflare/admin.test.mjs
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm Dropper.spec
      - name: Prepare HERS download
        run: Copy-Item dist/Dropper.exe dist/HERS-Dropper.exe
      - name: Test EXE without Python commands
        env:
          AGENCYKEY_RECORDER_DEMO_EXPORT: qa-output/scroll-demo.mp4
        run: python scripts/smoke_exe.py dist/HERS-Dropper.exe
      - name: Preserve tested executable
        uses: actions/upload-artifact@v4
        with:
          name: Dropper-Windows
          path: |
            dist/Dropper.exe
            dist/HERS-Dropper.exe
            qa-output/scroll-demo.mp4
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hers-dropper-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            dist/Dropper.exe dist/HERS-Dropper.exe vendor/encoder/encoder-sources.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HERS Dropper · Windows" \
            --notes-file release-notes.md --latest
      - name: Verify released Windows downloads
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep="hers-dropper-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = "$keep"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$keep" --jq .object.sha)" = "$GITHUB_SHA"
          mkdir -p verified-release
          gh release download "$keep" --repo "$GITHUB_REPOSITORY" --dir verified-release \
            --pattern Dropper.exe --pattern HERS-Dropper.exe --pattern encoder-sources.tar.gz
          cmp dist/Dropper.exe verified-release/Dropper.exe
          cmp dist/HERS-Dropper.exe verified-release/HERS-Dropper.exe
          cmp vendor/encoder/encoder-sources.tar.gz verified-release/encoder-sources.tar.gz
